<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0D">
<title>fatcap.club</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen. A quiet halftone grid (blotter sheet) breathing behind a full-width wordmark, four corner labels and a request-access line. Single dark look by choice. */
:root{
  color-scheme: dark;
  --ink:#0E0E0D;
  --bone:#E4E1D9;
  --mute:#8F8C84;
  --dot:#E4E1D9;
  --sans:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --gut: clamp(16px, 2.2vw, 28px);
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--bone);font-family:var(--sans)}
#field{position:fixed;inset:0;width:100%;height:100%;display:block}
.stage{position:relative;z-index:1;height:100%;box-sizing:border-box;padding:var(--gut);display:grid;grid-template-rows:auto 1fr auto auto}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.br::before{content:"[\00a0"}.br::after{content:"\00a0]"}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top a{color:inherit;text-decoration:none}
.top a:hover{text-decoration:line-through}
h1{margin:0;align-self:end;white-space:nowrap;font-variation-settings:"wdth" 125;font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.76;font-size:15.6vw;padding-bottom:.05em;padding-right:.04em;text-align:center;animation:in 1.4s cubic-bezier(.2,.8,.1,1) both}
h1 .dot{color:var(--dot);cursor:pointer;transition:color .25s;-webkit-tap-highlight-color:transparent}
h1 .dot:focus-visible{outline-offset:-.1em}
@keyframes in{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--bone)}
.bottom p{margin:0;max-width:44ch;color:var(--bone)}
#req{display:flex;align-items:center;border-bottom:1px solid var(--bone);min-width:min(100%,360px)}
#req label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{flex:1;min-width:0;min-height:44px;background:transparent;border:0;color:var(--bone);font-family:var(--mono);font-size:13px;letter-spacing:.04em;outline:none}
input::placeholder{color:var(--mute);text-transform:uppercase}
button{min-height:44px;background:transparent;border:0;color:var(--bone);cursor:pointer;padding:0 0 0 14px;font-family:var(--mono)}
button:hover{color:var(--dot)}
#req button{font-size:20px;padding:0 4px 0 18px;transition:transform .2s,color .2s}
#req button:hover{transform:translateX(4px)}

/* login drop-down */
.top{position:relative}
.login-btn{min-height:0;padding:0;font-size:11.5px}
.login-btn[aria-expanded="true"]{color:var(--dot)}
.rec{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--dot);margin-right:.5em;vertical-align:.08em;animation:rec 1.6s steps(1) infinite}
@keyframes rec{50%{opacity:.15}}
.panel.left{left:0;right:auto}
.tease-img{position:relative;aspect-ratio:3/4;max-width:100%;margin:12px;border:1px solid var(--bone);overflow:hidden;background:var(--ink)}
.tease-img img,.tease-img canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.tease-cap{display:flex;justify-content:space-between;padding:0 12px 12px;color:var(--mute)}
.panel{position:absolute;right:0;top:calc(100% + 12px);z-index:5;width:min(340px,calc(100vw - 2 * var(--gut)));box-sizing:border-box;
  background:var(--ink);border:1px solid var(--bone);
  background-image:radial-gradient(rgba(228,225,217,.09) 1.2px,transparent 1.4px);background-size:8px 8px;
  box-shadow:8px 8px 0 rgba(0,0,0,.6)}
.panel[hidden]{display:none}
.panel.open{animation:drop .42s steps(7) both}
@keyframes drop{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.panel.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bone);background:var(--ink)}
.panel-head button{min-height:28px;padding:0 2px;font-size:16px;line-height:1}
.panel form{display:flex;flex-direction:column;gap:14px;padding:16px 12px 14px;background:linear-gradient(var(--ink),rgba(14,14,13,.85))}
.panel .f{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--mute)}
.panel .f:focus-within{border-color:var(--dot)}
.panel input:focus-visible{outline:none}
.panel label{color:var(--mute)}
.panel input{flex:none;height:34px;min-height:0;font-size:14px}
.panel .go{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
.panel .go button{padding:0 0 0 12px;font-size:18px}
.panel .msg{color:var(--dot);min-height:1.2em}
:focus-visible{outline:1px solid var(--bone);outline-offset:4px}
.note{min-height:1.2em;margin-top:8px;text-align:right;color:var(--mute)}
br.m{display:none}
@media (max-width:700px){
  /* phone: wordmark on two lines, each as wide as the screen allows */
  br.m{display:inline}
  h1{line-height:.84}
  .panel input{font-size:16px;height:38px}
  .mono{font-size:13px}
  .bottom{flex-direction:column;align-items:stretch;gap:22px;padding-top:20px}
  .bottom p{font-size:13px}
  input{font-size:16px;min-height:52px}
  #req button{font-size:26px;min-height:52px}
  .note{text-align:left}
  .login-btn{font-size:13px;min-height:44px}
  .top{align-items:center}
}
/* film grain + light CRT: all overlays, never catch clicks */
.fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.grain{inset:-100%;width:300%;height:300%;opacity:.085;animation:grain .6s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-11%,7%)}40%{transform:translate(8%,-13%)}60%{transform:translate(-6%,-4%)}80%{transform:translate(13%,10%)}100%{transform:translate(0,0)}}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.09) 0 1px,transparent 1px 4px);mix-blend-mode:multiply}
.vig{background:radial-gradient(120% 95% at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%)}
.stage{animation:flick 4s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}31%{opacity:.965}32%{opacity:1}67%{opacity:.98}68%{opacity:1}}
h1{text-shadow:-.012em 0 rgba(255,40,80,.28),.012em 0 rgba(40,170,255,.28)}
@media (prefers-reduced-motion:reduce){h1,.panel.open,.grain,.stage{animation:none}}
</style>

<canvas id="field" aria-hidden="true"></canvas>
<div class="fx grain" id="grain" aria-hidden="true"></div>
<div class="fx scan" aria-hidden="true"></div>
<div class="fx vig" aria-hidden="true"></div>

<div class="stage">
  <div class="top mono">
    <button class="br mono login-btn" id="teaseBtn" type="button" aria-expanded="false" aria-controls="tease"><span class="rec" aria-hidden="true"></span>001</button>
    <div class="panel left mono" id="tease" role="dialog" aria-label="Issue 001 preview" hidden>
      <div class="panel-head"><span class="br">001</span><button type="button" id="teaseClose" aria-label="Close">&times;</button></div>
      <div class="tease-img">
        <img id="teaseImg" src="teaser.jpg" alt="Issue 001 cover preview" hidden>
        <canvas id="teaseCanvas" aria-hidden="true"></canvas>
      </div>
      <div class="tease-cap"><span>Issue 001</span><span>Soon</span></div>
    </div>
    <button class="br mono login-btn" id="loginBtn" type="button" aria-expanded="false" aria-controls="login">Log in</button>
    <div class="panel mono" id="login" role="dialog" aria-label="Member log in" hidden>
      <div class="panel-head"><span class="br">Members</span><button type="button" id="loginClose" aria-label="Close">&times;</button></div>
      <form id="loginForm" novalidate autocomplete="on">
        <div class="f"><label for="lUser">Email or member no.</label><input id="lUser" type="text" autocomplete="username" spellcheck="false"></div>
        <div class="f"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password"></div>
        <div class="go"><span class="msg" id="lMsg" role="status"></span><button type="submit" aria-label="Log in">&rarr;</button></div>
      </form>
    </div>
  </div>
  <div></div>
  <h1 id="mark">Fatcap<br class="m"><span class="dot" id="dot" role="button" tabindex="0" aria-label="Change dot color">.</span>club</h1>
  <div class="bottom mono">
    <p>Graffiti / Skateboarding / Lifestyle</p>
    <div>
      <form id="req" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="Your email">
        <button type="submit" aria-label="Request access">&rarr;</button>
      </form>
      <div class="note" id="note" role="status"></div>
    </div>
  </div>
</div>

<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* dot color: picked at random on the first visit, then kept for this browser */
const DOTS = ['#FF5FA2', '#FF5A1F', '#3D6BFF', '#CFCFCF'];
let dot = null;
try { dot = localStorage.getItem('fatcap-dot'); } catch (e) {}
if (!DOTS.includes(dot)) { dot = DOTS[Math.random() * DOTS.length | 0]; try { localStorage.setItem('fatcap-dot', dot); } catch (e) {} }
document.documentElement.style.setProperty('--dot', dot);

/* film grain tile */
(() => {
  const g = document.createElement('canvas'), s = 256; g.width = g.height = s;
  const x = g.getContext('2d'), d = x.createImageData(s, s);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255 | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${g.toDataURL()})`;
})();

/* login drop-down: not connected to accounts yet, always rejects */
const lBtn = document.getElementById('loginBtn'), panel = document.getElementById('login'), lForm = document.getElementById('loginForm'), lMsg = document.getElementById('lMsg');
function openLogin() {
  closeTease();
  panel.hidden = false; panel.classList.remove('shake'); panel.classList.add('open');
  lBtn.setAttribute('aria-expanded', 'true'); lMsg.textContent = '';
  setTimeout(() => document.getElementById('lUser').focus(), reduce ? 0 : 200);
}
function closeLogin(refocus) {
  panel.hidden = true; panel.classList.remove('open', 'shake'); lBtn.setAttribute('aria-expanded', 'false');
  if (refocus) lBtn.focus();
}
lBtn.addEventListener('click', () => panel.hidden ? openLogin() : closeLogin());
document.getElementById('loginClose').addEventListener('click', () => closeLogin(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) closeLogin(true); });
document.addEventListener('pointerdown', e => { if (!panel.hidden && !panel.contains(e.target) && e.target !== lBtn) closeLogin(); });
lForm.addEventListener('submit', e => {
  e.preventDefault();
  const btn = lForm.querySelector('button[type=submit]');
  btn.disabled = true; lMsg.textContent = 'Checking...';
  setTimeout(() => {
    btn.disabled = false; lMsg.textContent = 'Invalid details.';
    document.getElementById('lPass').value = '';
    panel.classList.remove('open', 'shake'); void panel.offsetWidth; if (!reduce) panel.classList.add('shake');
  }, 700);
});

/* 001 teaser: shows teaser.jpg if it exists, otherwise a generated dithered cover */
const tBtn = document.getElementById('teaseBtn'), tease = document.getElementById('tease');
const tImg = document.getElementById('teaseImg'), tCan = document.getElementById('teaseCanvas');
let teaserDrawn = false;
tImg.addEventListener('load', () => { tImg.hidden = false; tCan.hidden = true; });
tImg.addEventListener('error', () => { tImg.remove(); });
function drawTeaser() {
  if (teaserDrawn || !tImg.hidden) return; teaserDrawn = true;
  const W = 300, H = 400, src = document.createElement('canvas'); src.width = W; src.height = H;
  const x = src.getContext('2d');
  let seed = 7; const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  // wall
  x.fillStyle = '#777'; x.fillRect(0, 0, W, H);
  for (let y = 0, row = 0; y < H; y += 18, row++) for (let bx = (row % 2) * -28; bx < W; bx += 56) { const v = 120 + r() * 50 | 0; x.fillStyle = `rgb(${v},${v},${v})`; x.fillRect(bx + 1.5, y + 1.5, 53, 15); }
  const lg = x.createRadialGradient(W * .25, H * .2, 10, W * .3, H * .3, W * 1.1); lg.addColorStop(0, 'rgba(255,255,255,.45)'); lg.addColorStop(1, 'rgba(0,0,0,.55)'); x.fillStyle = lg; x.fillRect(0, 0, W, H);
  // piece: fat strokes, drips, highlights
  x.lineCap = 'round'; x.lineJoin = 'round';
  for (let k = 0; k < 6; k++) { x.strokeStyle = '#111'; x.lineWidth = 22 + r() * 18; x.beginPath(); let px = 30 + k * 44, py = 200 + r() * 40; x.moveTo(px, py); for (let s = 0; s < 3; s++) x.quadraticCurveTo(px + (r() - .3) * 70, py + (r() - .5) * 130, px += 10 + r() * 22, py += (r() - .5) * 90); x.stroke(); }
  x.fillStyle = '#111'; for (let k = 0; k < 10; k++) x.fillRect(25 + r() * 250, 240 + r() * 30, 2 + r() * 3, 20 + r() * 80);
  x.strokeStyle = '#fff'; x.lineWidth = 4; for (let k = 0; k < 6; k++) { x.beginPath(); const hx = 40 + k * 44; x.moveTo(hx, 185 + r() * 20); x.lineTo(hx + 8, 178 + r() * 20); x.stroke(); }
  // masthead + issue number
  x.font = '900 64px Archivo, Impact, sans-serif'; x.textBaseline = 'top';
  const m = 'FATCAP', mw = x.measureText(m).width, fs = 64 * (W - 24) / mw;
  x.font = `900 ${fs}px Archivo, Impact, sans-serif`; x.lineWidth = 6; x.strokeStyle = '#000'; x.strokeText(m, 12, 10); x.fillStyle = '#fff'; x.fillText(m, 12, 10);
  x.font = '900 120px Archivo, Impact, sans-serif'; x.textBaseline = 'alphabetic'; x.textAlign = 'right'; x.strokeText('001', W - 12, H - 16); x.fillText('001', W - 12, H - 16);
  x.fillStyle = '#fff'; x.fillRect(12, H - 58, 62, 42); x.fillStyle = '#000'; for (let bx = 16; bx < 70; bx += 3 + (r() * 3 | 0)) x.fillRect(bx, H - 54, 1 + (r() * 2 | 0), 30);
  // two-tone ordered dither
  const cell = 2, w = W / cell, h = H / cell; tCan.width = w; tCan.height = h;
  const o = tCan.getContext('2d'); o.drawImage(src, 0, 0, w, h);
  const im = o.getImageData(0, 0, w, h), d = im.data;
  const b2 = (a, b) => ((a & 1) ^ (b & 1)) * 2 + (b & 1);
  for (let y = 0, i = 0; y < h; y++) for (let xx = 0; xx < w; xx++, i += 4) {
    const bay = (b2(xx, y) * 16 + b2(xx >> 1, y >> 1) * 4 + b2(xx >> 2, y >> 2) + .5) / 64;
    const l = ((d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11) / 255 - .5) * 1.3 + .5;
    const on = l > bay; d[i] = on ? 228 : 14; d[i + 1] = on ? 225 : 14; d[i + 2] = on ? 217 : 13;
  }
  o.putImageData(im, 0, 0);
}
function openTease() {
  closeLogin(); document.fonts.ready.then(drawTeaser);
  tease.hidden = false; tease.classList.add('open'); tBtn.setAttribute('aria-expanded', 'true');
  setTimeout(() => document.getElementById('teaseClose').focus(), reduce ? 0 : 200);
}
function closeTease(refocus) {
  if (tease.hidden) return;
  tease.hidden = true; tease.classList.remove('open'); tBtn.setAttribute('aria-expanded', 'false');
  if (refocus) tBtn.focus();
}
tBtn.addEventListener('click', () => tease.hidden ? openTease() : closeTease());
document.getElementById('teaseClose').addEventListener('click', () => closeTease(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTease(true); });
document.addEventListener('pointerdown', e => { if (!tease.contains(e.target) && !tBtn.contains(e.target)) closeTease(); });

/* clicking the dot cycles to the next color and keeps it */
const dotEl = document.getElementById('dot');
function cycle() {
  dot = DOTS[(DOTS.indexOf(dot) + 1) % DOTS.length];
  document.documentElement.style.setProperty('--dot', dot);
  try { localStorage.setItem('fatcap-dot', dot); } catch (e) {}
}
dotEl.addEventListener('click', cycle);
dotEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycle(); } });

/* fit the wordmark edge to edge */
const mark = document.getElementById('mark');
function fit() {
  mark.style.fontSize = '100px'; mark.style.display = 'inline-block';
  const w = mark.getBoundingClientRect().width, avail = mark.parentElement.clientWidth - parseFloat(getComputedStyle(mark.parentElement).paddingLeft) * 2;
  mark.style.display = ''; mark.style.fontSize = (100 * avail / w * .995) + 'px';
}
document.fonts.ready.then(fit); addEventListener('resize', fit); fit();

/* request access: forwarded by email through FormSubmit (alias hides the inbox address) */
const FORM_ENDPOINT = 'https://formsubmit.co/ajax/8ec625657977b1ded1f62fe4b1c13e39';
const req = document.getElementById('req');
req.addEventListener('submit', async e => {
  e.preventDefault();
  const em = document.getElementById('email'), n = document.getElementById('note'), btn = req.querySelector('button');
  if (!em.value || !em.checkValidity()) { n.textContent = 'Enter a working email.'; em.focus(); return; }
  btn.disabled = true; n.textContent = 'Sending...';
  try {
    const res = await fetch(FORM_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: em.value, _subject: 'fatcap.club access request', _template: 'table', _captcha: 'false' })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false || data.success === 'false') throw new Error(data.message || res.status);
    n.textContent = 'Got it. We will be in touch.'; em.value = '';
  } catch (err) {
    console.error('Access request failed:', err);
    n.textContent = /activat/i.test(String(err && err.message))
      ? 'Signups open soon. Check back shortly.'
      : 'Could not send right now. Try again in a minute.';
  } finally { btn.disabled = false; }
});

/* halftone grid: one square per cell, sized by a slow noise field */
const c = document.getElementById('field');
const gl = c.getContext('webgl', { antialias: false, alpha: false });
if (!gl) return;
const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs = `precision highp float;
uniform vec2 res;uniform float t;uniform vec2 m;uniform float md;uniform float cs;uniform float dpr;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
void main(){
  vec2 px=gl_FragCoord.xy/dpr;
  float H=res.y/dpr;
  vec2 cell=floor(px/cs);
  vec2 f=fract(px/cs)-.5;
  vec2 p=(cell+.5)*cs/H;
  float v=fbm(p*2.2+vec2(t*.04,-t*.03));
  float s=smoothstep(.3,.75,v);
  float d=distance(p,m);
  float g=md*exp(-d*d*30.);
  s=clamp(s+g*.8,0.,1.);
  float half_=mix(.06,.42,s);
  float sq=step(max(abs(f.x),abs(f.y)),half_);
  vec3 ink=vec3(.055,.055,.051);
  vec3 dim=vec3(.17,.165,.155);
  vec3 lit=vec3(.42,.41,.39);
  vec3 col=mix(dim,lit,g);
  gl_FragColor=vec4(mix(ink,col,sq),1.);
}`;
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = k => gl.getUniformLocation(pr, k);
const uRes = U('res'), uT = U('t'), uM = U('m'), uMd = U('md'), uCs = U('cs'), uDpr = U('dpr');
let dpr = 1;
function size() { dpr = Math.min(devicePixelRatio || 1, 2); c.width = innerWidth * dpr; c.height = innerHeight * dpr; gl.viewport(0, 0, c.width, c.height); }
addEventListener('resize', size); size();

let mx = .5, my = .5, tx = .5, ty = .5, md = 0, mdT = 0;
addEventListener('pointermove', e => { tx = e.clientX / innerHeight; ty = (innerHeight - e.clientY) / innerHeight; mdT = 1; });
document.addEventListener('pointerleave', () => { mdT = 0; });
const t0 = performance.now();
function draw(now) {
  mx += (tx - mx) * .08; my += (ty - my) * .08; md += (mdT - md) * .05;
  gl.uniform2f(uRes, c.width, c.height);
  gl.uniform1f(uT, reduce ? 20 : (now - t0) / 1000);
  gl.uniform2f(uM, mx, my); gl.uniform1f(uMd, md);
  gl.uniform1f(uCs, innerWidth < 600 ? 12 : 16); gl.uniform1f(uDpr, dpr);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script>
