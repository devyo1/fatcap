<title>fatcap.club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen. A quiet halftone grid (blotter sheet) breathing behind a full-width wordmark, four corner labels and a request-access line. Single dark look by choice. */
:root{
  color-scheme: dark;
  --ink:#0E0E0D;
  --bone:#E4E1D9;
  --mute:#8F8C84;
  --dot:#E4E1D9;
  --sans:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --gut: clamp(16px, 2.2vw, 28px);
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--bone);font-family:var(--sans)}
#field{position:fixed;inset:0;width:100%;height:100%;display:block}
.stage{position:relative;z-index:1;height:100%;box-sizing:border-box;padding:var(--gut);display:grid;grid-template-rows:auto 1fr auto auto}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.br::before{content:"[\00a0"}.br::after{content:"\00a0]"}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top a{color:inherit;text-decoration:none}
.top a:hover{text-decoration:line-through}
h1{margin:0;align-self:end;white-space:nowrap;font-variation-settings:"wdth" 125;font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.76;font-size:15.6vw;padding-bottom:.05em;animation:in 1.4s cubic-bezier(.2,.8,.1,1) both}
h1 .dot{color:var(--dot);cursor:pointer;transition:color .25s;-webkit-tap-highlight-color:transparent}
h1 .dot:focus-visible{outline-offset:-.1em}
@keyframes in{from{letter-spacing:.02em;filter:blur(6px)}to{letter-spacing:-.04em;filter:none}}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--bone)}
.bottom p{margin:0;max-width:44ch;color:var(--bone)}
form{display:flex;align-items:center;border-bottom:1px solid var(--bone);min-width:min(100%,360px)}
form label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{flex:1;min-width:0;min-height:44px;background:transparent;border:0;color:var(--bone);font-family:var(--mono);font-size:13px;letter-spacing:.04em;outline:none}
input::placeholder{color:var(--mute);text-transform:uppercase}
button{min-height:44px;background:transparent;border:0;color:var(--bone);cursor:pointer;padding:0 0 0 14px}
button:hover{color:var(--dot)}
:focus-visible{outline:1px solid var(--bone);outline-offset:4px}
.note{min-height:1.2em;margin-top:8px;text-align:right;color:var(--mute)}
@media (max-width:600px){.top .hide{display:none}.bottom{flex-direction:column;align-items:stretch}.note{text-align:left}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style>

<canvas id="field" aria-hidden="true"></canvas>

<div class="stage">
  <div class="top mono">
    <span class="br">fatcap.club</span>
    <a class="br" href="#">Log in</a>
  </div>
  <div></div>
  <h1 id="mark">Fatcap<span class="dot" id="dot" role="button" tabindex="0" aria-label="Change dot color">.</span>club</h1>
  <div class="bottom mono">
    <p>Graffiti / Skateboarding / Lifestyle</p>
    <div>
      <form id="req" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="Your email">
        <button class="mono" type="submit">Request access &rarr;</button>
      </form>
      <div class="note" id="note" role="status"></div>
    </div>
  </div>
</div>

<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* dot color: picked at random on the first visit, then kept for this browser */
const DOTS = ['#FF5FA2', '#FF5A1F', '#3D6BFF', '#CFCFCF'];
let dot = null;
try { dot = localStorage.getItem('fatcap-dot'); } catch (e) {}
if (!DOTS.includes(dot)) { dot = DOTS[Math.random() * DOTS.length | 0]; try { localStorage.setItem('fatcap-dot', dot); } catch (e) {} }
document.documentElement.style.setProperty('--dot', dot);

/* clicking the dot cycles to the next color and keeps it */
const dotEl = document.getElementById('dot');
function cycle() {
  dot = DOTS[(DOTS.indexOf(dot) + 1) % DOTS.length];
  document.documentElement.style.setProperty('--dot', dot);
  try { localStorage.setItem('fatcap-dot', dot); } catch (e) {}
}
dotEl.addEventListener('click', cycle);
dotEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycle(); } });

/* fit the wordmark edge to edge */
const mark = document.getElementById('mark');
function fit() {
  mark.style.fontSize = '100px'; mark.style.display = 'inline-block';
  const w = mark.getBoundingClientRect().width, avail = mark.parentElement.clientWidth - parseFloat(getComputedStyle(mark.parentElement).paddingLeft) * 2;
  mark.style.display = ''; mark.style.fontSize = (100 * avail / w * .995) + 'px';
}
document.fonts.ready.then(fit); addEventListener('resize', fit); fit();

/* request access: forwarded by email through FormSubmit (alias hides the inbox address) */
const FORM_ENDPOINT = 'https://formsubmit.co/ajax/8ec625657977b1ded1f62fe4b1c13e39';
const req = document.getElementById('req');
req.addEventListener('submit', async e => {
  e.preventDefault();
  const em = document.getElementById('email'), n = document.getElementById('note'), btn = req.querySelector('button');
  if (!em.value || !em.checkValidity()) { n.textContent = 'Enter a working email.'; em.focus(); return; }
  btn.disabled = true; n.textContent = 'Sending...';
  try {
    const res = await fetch(FORM_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: em.value, _subject: 'fatcap.club access request', _template: 'table', _captcha: 'false' })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false || data.success === 'false') throw new Error(data.message || res.status);
    n.textContent = 'Got it. We will be in touch.'; em.value = '';
  } catch (err) {
    console.error('Access request failed:', err);
    n.textContent = /activat/i.test(String(err && err.message))
      ? 'Signups open soon. Check back shortly.'
      : 'Could not send right now. Try again in a minute.';
  } finally { btn.disabled = false; }
});

/* halftone grid: one square per cell, sized by a slow noise field */
const c = document.getElementById('field');
const gl = c.getContext('webgl', { antialias: false, alpha: false });
if (!gl) return;
const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs = `precision highp float;
uniform vec2 res;uniform float t;uniform vec2 m;uniform float md;uniform float cs;uniform float dpr;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
void main(){
  vec2 px=gl_FragCoord.xy/dpr;
  float H=res.y/dpr;
  vec2 cell=floor(px/cs);
  vec2 f=fract(px/cs)-.5;
  vec2 p=(cell+.5)*cs/H;
  float v=fbm(p*2.2+vec2(t*.04,-t*.03));
  float s=smoothstep(.3,.75,v);
  float d=distance(p,m);
  float g=md*exp(-d*d*30.);
  s=clamp(s+g*.8,0.,1.);
  float half_=mix(.06,.42,s);
  float sq=step(max(abs(f.x),abs(f.y)),half_);
  vec3 ink=vec3(.055,.055,.051);
  vec3 dim=vec3(.17,.165,.155);
  vec3 lit=vec3(.42,.41,.39);
  vec3 col=mix(dim,lit,g);
  gl_FragColor=vec4(mix(ink,col,sq),1.);
}`;
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = k => gl.getUniformLocation(pr, k);
const uRes = U('res'), uT = U('t'), uM = U('m'), uMd = U('md'), uCs = U('cs'), uDpr = U('dpr');
let dpr = 1;
function size() { dpr = Math.min(devicePixelRatio || 1, 2); c.width = innerWidth * dpr; c.height = innerHeight * dpr; gl.viewport(0, 0, c.width, c.height); }
addEventListener('resize', size); size();

let mx = .5, my = .5, tx = .5, ty = .5, md = 0, mdT = 0;
addEventListener('pointermove', e => { tx = e.clientX / innerHeight; ty = (innerHeight - e.clientY) / innerHeight; mdT = 1; });
document.addEventListener('pointerleave', () => { mdT = 0; });
const t0 = performance.now();
function draw(now) {
  mx += (tx - mx) * .08; my += (ty - my) * .08; md += (mdT - md) * .05;
  gl.uniform2f(uRes, c.width, c.height);
  gl.uniform1f(uT, reduce ? 20 : (now - t0) / 1000);
  gl.uniform2f(uM, mx, my); gl.uniform1f(uMd, md);
  gl.uniform1f(uCs, innerWidth < 600 ? 12 : 16); gl.uniform1f(uDpr, dpr);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script>
